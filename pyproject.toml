[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geospark"
version = "0.1.0"
description = "The Open-Source Geospatial Intelligence Protocol & Engine. Give any AI model a spatial mind."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "GeoSpark Contributors" },
]
keywords = [
    "geospatial",
    "spatial-reasoning",
    "llm",
    "ai",
    "gis",
    "remote-sensing",
    "mcp",
    "protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.25",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "fiona>=1.9",
    "h3>=4.0",
    "duckdb>=0.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
llm = [
    "openai>=1.10",
    "anthropic>=0.18",
]
supabase = [
    "supabase>=2.0",
]
viz = [
    "folium>=0.16",
    "matplotlib>=3.8",
    "pydeck>=0.9",
]
satellite = [
    "pystac-client>=0.7",
    "rio-tiler>=6.0",
    "stackstac>=0.5",
]
postgis = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
]
all = [
    "geospark[geo,api,llm,viz,satellite,postgis]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.6",
]

[project.scripts]
geospark = "geospark.cli:main"

[project.urls]
Homepage = "https://github.com/geospark/geospark"
Documentation = "https://geospark.dev"
Repository = "https://github.com/geospark/geospark"
Issues = "https://github.com/geospark/geospark/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["geospark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
