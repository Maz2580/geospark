# Production compose -- lightweight for free-tier VMs
# Uses Supabase (remote) for DB, no local PostGIS/Redis needed
# Cloudflare tunnel runs as a separate systemd service (cloudflared-geospark)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Cloudflare route: geospark.terrascout.app -> localhost:8080

services:
  geospark:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: geospark-api
    ports:
      - "127.0.0.1:8080:8000"  # Host 8080 -> container 8000; cloudflared routes external traffic
    env_file: .env
    environment:
      - GEOSPARK_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
