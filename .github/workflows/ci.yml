name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"

      - name: Lint with ruff
        run: |
          ruff check geospark/ tests/

      - name: Type check (blocking for the core modules)
        run: |
          mypy geospark/protocol geospark/engine geospark/middleware geospark/security.py geospark/sandbox.py geospark/utils --ignore-missing-imports

      - name: Type check (whole package, informational)
        run: |
          mypy geospark/ --ignore-missing-imports
        continue-on-error: true

      - name: Check the [all] extra resolves to geospark-ai, not the unrelated geospark package
        run: |
          pip install --dry-run -e ".[all]" | tee /tmp/all-extra.txt
          ! grep -qiE "(pyspark|[^-]geospark-[0-9])" /tmp/all-extra.txt

      - name: MCP server works with only the [mcp] extra (what Claude Desktop users install)
        run: |
          python -m venv /tmp/mcp-only
          /tmp/mcp-only/bin/pip install -q ".[mcp]" pytest
          /tmp/mcp-only/bin/python -c "import importlib.util as u; assert u.find_spec('fastapi') is None, 'fastapi leaked into [mcp]'"
          /tmp/mcp-only/bin/python -m pytest -q -p no:cacheprovider tests/test_stdio_smoke.py

      - name: Run tests
        run: |
          pytest tests/ -v --cov=geospark --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
