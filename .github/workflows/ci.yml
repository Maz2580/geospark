name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"

      - name: Lint with ruff
        run: |
          ruff check geospark/ tests/

      - name: Type check with mypy
        run: |
          mypy geospark/ --ignore-missing-imports
        continue-on-error: true

      - name: Check the [all] extra resolves to geospark-ai, not the unrelated geospark package
        run: |
          pip install --dry-run -e ".[all]" | tee /tmp/all-extra.txt
          ! grep -qiE "(pyspark|[^-]geospark-[0-9])" /tmp/all-extra.txt

      - name: Run tests
        run: |
          pytest tests/ -v --cov=geospark --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
