# Production compose -- lightweight for free-tier VMs
# Uses Supabase (remote) for DB, no local PostGIS/Redis needed
# GeoSpark tunnel runs in Docker (separate from host's UrbanMind tunnel)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Cloudflare route: geospark.terrascout.app -> localhost:8080

services:
  geospark:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: geospark-api
    ports:
      - "127.0.0.1:8080:8000"  # Host 8080 -> container 8000; cloudflared routes external traffic
    env_file: .env
    environment:
      - GEOSPARK_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: geospark-tunnel
    command: tunnel run
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - geospark
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
